# MCGame edge nginx — handles three independent things in one process:
#   stream {} — Layer-4 TCP passthrough for the Flash client RTMPE handshake
#               (the Go server terminates Adobe DH+RC4 itself in
#               pkg/rtmp/handshake/complex.go).
#   http   {} — static asset serving (game SWF tree under /s/, crossdomain.xml
#               for Flash). Replaces the old standalone `frontend` nginx
#               container.
# See docs/research/2026-04-26_01_NGINX_RTMP_HOSTING_RESEARCH.md.

worker_processes      auto;
worker_rlimit_nofile  16384;

events {
    worker_connections 4096;
    multi_accept       on;
}

stream {
    log_format rtmp_basic '$remote_addr [$time_local] '
                          '$protocol $status $bytes_sent $bytes_received '
                          '$session_time "$upstream_addr"';

    access_log /var/log/nginx/rtmp_access.log rtmp_basic;
    error_log  /var/log/nginx/rtmp_error.log  warn;

    # 127.0.0.11 is Docker's embedded DNS. Resolving on demand (rather than
    # via a static `upstream { server ... }` block) means nginx survives a
    # mcgame-server restart without needing its own restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 1935;

        set $mcgame_backend "mcgame-server:1935";
        proxy_pass            $mcgame_backend;

        proxy_protocol        on;
        proxy_connect_timeout 5s;
        proxy_timeout         10m;
        tcp_nodelay           on;
    }
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    sendfile_max_chunk 512k;
    tcp_nopush         on;
    tcp_nodelay        on;

    # Long-lived keepalive to cloudflared / ngrok / direct clients.
    # Flash loads many small assets in parallel; without this, each request
    # would open a fresh TCP/TLS — and intermittent connect failures show up
    # as 502 at the upstream tunnel.
    keepalive_timeout  120s;
    keepalive_requests 10000;

    client_body_timeout    15s;
    client_header_timeout  15s;
    send_timeout           60s;
    client_max_body_size   64k;
    server_tokens          off;

    limit_req_zone  $binary_remote_addr zone=auth_rate:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=ws_conn_ip:10m;
    limit_conn_zone $binary_remote_addr zone=http_conn_ip:10m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Cache file descriptors so repeated SWF / image lookups skip stat().
    open_file_cache          max=10000 inactive=60s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    gzip               on;
    gzip_vary          on;
    gzip_min_length    1024;
    gzip_comp_level    5;
    gzip_proxied       any;
    gzip_types         text/plain text/xml text/css application/xml application/json application/javascript image/svg+xml;

    access_log /var/log/nginx/http_access.log;
    error_log  /var/log/nginx/http_error.log warn;

    # Cache long for immutable game assets, no-cache for dynamic-ish ones.
    map $request_uri $asset_expires {
        ~*\.(swf|jpg|jpeg|png|gif|ico|css|js|woff2?|ttf|eot)$  30d;
        default                                                   off;
    }

    server {
        listen 80 default_server;
        # h2c (HTTP/2 cleartext) so cloudflared can multiplex hundreds of
        # parallel /s/res/* requests over a single origin TCP connection
        # instead of saturating its HTTP/1.1 pool. Requires originRequest:
        # http2Origin: true on the cloudflared side.
        http2 on;

        server_name _;
        root /usr/share/nginx/html;
        resolver 127.0.0.11 valid=10s ipv6=off;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; worker-src 'self' blob:; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; frame-ancestors 'none';" always;

        location /api/auth/ {
            limit_req zone=auth_rate burst=5 nodelay;
            limit_conn http_conn_ip 10;
            set $ws_backend "http://mcgame-server:8090";
            proxy_pass $ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 15s;
        }

        location = /ws {
            limit_conn ws_conn_ip 5;
            set $ws_backend "http://mcgame-server:8090";
            proxy_pass $ws_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 75s;
            proxy_send_timeout 75s;
        }

        # Flash needs crossdomain.xml at the host root for cross-origin
        # NetConnection / NetStream from arbitrary domains.
        location = /crossdomain.xml {
            add_header Access-Control-Allow-Origin "*" always;
            try_files /crossdomain.xml =404;
        }

        # Resource directory: content-hash named files, treat as immutable.
        # Cloudflare's edge will cache and serve future hits without ever
        # touching origin, which kills the burst-load 502 source.
        location /s/res/ {
            expires    1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files  $uri =404;
        }

        location /s/sv/res/ {
            expires    1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            rewrite ^/s/sv/res/(.*)$ /s/res/$1 break;
            try_files  $uri =404;
        }

        location = /s/sv/GameLoaders.swf {
            expires    off;
            etag       off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files  $uri =404;
        }

        location = /s/sv/6a41a5ba5c0006ab4e0c1321a2b05027 {
            expires    off;
            etag       off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files  $uri =404;
        }

        location = /s/6a41a5ba5c0006ab4e0c1321a2b05027 {
            expires    off;
            etag       off;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
            add_header Pragma "no-cache" always;
            try_files  $uri =404;
        }

        location /s/ {
            expires       $asset_expires;
            add_header    Cache-Control "public" always;
            try_files     $uri $uri/ =404;
        }

        location ~* ^/assets/.*\.json$ {
            root /usr/share/nginx/html/web;
            expires -1;
            add_header Cache-Control "no-cache, must-revalidate" always;
            try_files $uri =404;
        }

        location /assets/ {
            root /usr/share/nginx/html/web;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            try_files $uri =404;
        }

        location / {
            limit_conn http_conn_ip 30;
            root /usr/share/nginx/html/web;
            index index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            try_files $uri $uri/ /index.html;
        }
    }
}
